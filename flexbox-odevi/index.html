<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Lab - Sevval Culcu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wrapper">
        
        <!-- 1) Navbar -->
        <header class="navbar">
            <div class="logo">MyLogo</div>
            <nav class="nav-links">
                <a href="#">Anasayfa</a>
                <a href="#">Hakkımızda</a>
                <a href="#">Hizmetler</a>
                <a href="#">İletişim</a>
            </nav>
        </header>

        <!-- 2) Hero (İki Kolon) -->
        <section class="hero">
            <div class="hero-text">
                <h1>Flexbox Dünyasına Hoş Geldiniz</h1>
                <p>Bu alan projelerimizi sergilediğimiz hero bölgesidir. Flexbox ile düzenlenmiştir.</p>
                <button class="btn">Daha Fazla</button>
            </div>
            <div class="hero-image">
                <span>Görsel Alanı</span>
            </div>
        </section>

        <!-- 3) Kartlar Bölümü -->
        <section class="cards-section">
            <div class="card">Kart 1</div>
            <div class="card">Kart 2</div>
            <div class="card">Kart 3</div>
            <div class="card">Kart 4</div>
            <div class="card">Kart 5</div>
            <div class="card">Kart 6</div>
        </section>

        <!-- 4) Flex Grow Uygulama -->
        <section class="flex-grow-section">
            <div class="grow-box box1">Grow 1</div>
            <div class="grow-box box2">Grow 2</div>
            <div class="grow-box box3">Grow 1</div>
        </section>

        <!-- 5) Footer -->
        <footer class="footer">
            <p>&copy; 2026 Şevval Çulcu - Flexbox Ödevi</p>
        </footer>

    </div>

</body>
</html>
