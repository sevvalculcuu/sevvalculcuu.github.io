<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Lab - Sevval Culcu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wrapper">
        
        <!-- 1) Navbar -->
        <header class="navbar">
            <div class="logo">MyLogo</div>
            <nav class="nav-links">
                <a href="../index.html" class="home-btn" style="background-color: #e63946; padding: 5px 10px; border-radius: 5px;">Ana Sayfaya Dön</a>
                <a href="#">Hakkımızda</a>
                <a href="#">Hizmetler</a>
                <a href="#">İletişim</a>
            </nav>
        </header>

        <!-- 2) Hero (İki Kolon) -->
        <section class="hero">
            <div class="hero-text">
                <h1>Flexbox Dünyasına Hoş Geldiniz</h1>
                <p>Bu alan projelerimizi sergilediğimiz hero bölgesidir. Flexbox ile düzenlenmiştir.</p>
                <button class="btn" onclick="alert('Daha fazla bilgi çok yakında!')">Daha Fazla</button>
            </div>
            <div class="hero-image">
                <span>Görsel Alanı</span>
            </div>
        </section>

        <!-- 3) Kartlar Bölümü -->
        <section class="cards-section">
            <button class="card" onclick="alert('Kart 1 Tıklandı!')">Kart 1</button>
            <button class="card" onclick="alert('Kart 2 Tıklandı!')">Kart 2</button>
            <button class="card" onclick="alert('Kart 3 Tıklandı!')">Kart 3</button>
            <button class="card" onclick="alert('Kart 4 Tıklandı!')">Kart 4</button>
            <button class="card" onclick="alert('Kart 5 Tıklandı!')">Kart 5</button>
            <button class="card" onclick="alert('Kart 6 Tıklandı!')">Kart 6</button>
        </section>

        <!-- 4) Flex Grow Uygulama -->
        <section class="flex-grow-section">
            <div class="grow-box box1">Grow 1</div>
            <div class="grow-box box2">Grow 2</div>
            <div class="grow-box box3">Grow 1</div>
        </section>

        <!-- 5) Footer -->
        <footer class="footer">
            <p>&copy; 2026 Şevval Çulcu - Flexbox Ödevi</p>
        </footer>

    </div>

</body>
</html>
